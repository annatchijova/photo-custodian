[project]
name = "photo-custodian"
version = "0.1.0"
description = "Local-first, review-driven photo and video inventory for Linux"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anna Tchijova" }]
dependencies = []

[project.scripts]
photo-custodian = "photo_custodian.cli:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
